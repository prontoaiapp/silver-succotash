<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro de Cliente | ProntoAí</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>:root{--b:#06192d;--lime:#a6e100;--ink:#0b1728;--line:#dce6ef;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:linear-gradient(145deg,var(--b) 0,#0a355d 34%,var(--bg) 34%)}.wrap{width:min(820px,calc(100% - 28px));margin:auto;padding:28px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;color:white;margin-bottom:44px}.top img{height:64px}.top span{color:#dfff78;font-weight:800}.hero{color:#fff;max-width:720px;margin-bottom:28px}.hero h1{font:800 clamp(2.4rem,6vw,4.5rem)/.98 Manrope,sans-serif;margin:16px 0}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{color:#ffffffbf;line-height:1.6}.eyebrow{display:inline-block;padding:8px 12px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff22;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.card{background:#fff;border-radius:30px;padding:34px;box-shadow:0 28px 70px #06192d26}.card h2{font:800 1.3rem Manrope,sans-serif;margin:8px 0 18px}.card h2:not(:first-child){margin-top:34px;padding-top:28px;border-top:1px solid #e5edf4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:15px}.field label{display:block;font-size:.78rem;font-weight:800;color:#475569;margin-bottom:7px}.field input,.field select{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:#fbfdff;font:inherit;outline:none}.checks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks label,.consent{display:flex;gap:9px;align-items:flex-start;font-size:.86rem;line-height:1.45}.checks label{padding:12px;border:1px solid #e0e8ef;border-radius:14px;background:#fbfdff}.submit{width:100%;border:0;border-radius:999px;background:var(--lime);color:#173000;padding:16px 20px;font-weight:800;font-size:1rem;margin-top:18px;cursor:pointer}.error{margin-top:14px;color:#b42318;font-weight:700}.success{text-align:center;background:#fff;border-radius:30px;padding:48px}.success img{height:66px}.success .check{width:76px;height:76px;border-radius:23px;display:grid;place-items:center;margin:20px auto;background:#eef9d5;color:#5e8200;font-size:2rem;font-weight:900}.back{display:inline-block;margin-top:20px;background:var(--lime);padding:14px 20px;border-radius:999px;font-weight:800;text-decoration:none;color:#173000}@media(max-width:700px){body{background:linear-gradient(180deg,var(--b) 0,#0a355d 20%,var(--bg) 20%)}.grid,.checks{grid-template-columns:1fr}.card{padding:22px}.hero h1{font-size:2.7rem}.top img{height:58px}}</style></head><body><main class="wrap"><header class="top"><a href="/"><img src="logo-prontoai.webp" alt="ProntoAí"></a><span>Cadastro gratuito</span></header><section class="hero"><span class="eyebrow">Clientes • ProntoAí</span><h1>Entre para o <em>ProntoAí.</em></h1><p>Serviços, entregas, fretes e soluções locais em um só lugar.</p></section><form id="form" class="card"><h2>1. Seus dados</h2><div class="grid"><div class="field"><label>Nome completo *</label><input id="nome" required></div><div class="field"><label>WhatsApp *</label><input id="whatsapp" required inputmode="tel"></div><div class="field"><label>E-mail *</label><input id="email" type="email" required></div><div class="field"><label>Cidade *</label><select id="cidade" required><option value="">Selecione</option><option>Santos</option><option>São Vicente</option><option>Praia Grande</option><option>Guarujá</option><option>Cubatão</option><option>Peruíbe</option><option>Itanhaém</option><option>Mongaguá</option><option>Itariri</option><option>Outra cidade</option></select></div><div class="field" id="cidadeOutroWrap" hidden><label>Digite sua cidade *</label><input id="cidadeOutro"></div><div class="field"><label>Bairro *</label><input id="bairro" required></div></div><h2>2. O que você pretende usar?</h2><div class="field"><label>Selecione uma ou mais opções</label><div class="checks"><label><input type="checkbox" value="Serviços">Serviços</label><label><input type="checkbox" value="Entregas">Entregas</label><label><input type="checkbox" value="Fretes">Fretes</label><label><input type="checkbox" value="Comércios">Comércios</label><label><input type="checkbox" value="Ainda quero conhecer">Ainda quero conhecer</label></div></div><div class="field"><label>Como conheceu o ProntoAí?</label><select id="origem"><option value="">Selecione</option><option>WhatsApp</option><option>Indicação</option><option>Instagram</option><option>Comércio</option><option>Profissional</option><option>Outro</option></select></div><div class="field" id="indicacaoWrap" hidden><label>Quem indicou você?</label><input id="indicacao"></div><label class="consent"><input type="checkbox" id="aceite">Li e concordo com os Termos de Uso e Política de Privacidade do ProntoAí. *</label><div id="erro" class="error"></div><button id="submit" class="submit">Criar meu cadastro</button></form><div id="ok" class="success" hidden><img src="logo-prontoai.webp" alt="ProntoAí"><div class="check">✓</div><h1>Cadastro realizado!</h1><p>Seja bem-vindo ao ProntoAí.</p><a class="back" href="/">Conhecer o ProntoAí</a></div></main><script>const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxCRF7NdxVTNplnXwUjR-PUgTAd0xnh7J5Qj5cDFtVc5YDNQ0tgM6bmOpCPGWLubLC3/exec';const $=id=>document.getElementById(id);$('cidade').onchange=()=>{$('cidadeOutroWrap').hidden=$('cidade').value!=='Outra cidade'};$('origem').onchange=()=>{$('indicacaoWrap').hidden=$('origem').value!=='Indicação'};$('whatsapp').oninput=e=>{let d=e.target.value.replace(/\D/g,'').slice(0,11);if(d.length>10)d=d.replace(/^(\d{2})(\d{5})(\d{4})$/,'($1) $2-$3');else if(d.length>6)d=d.replace(/^(\d{2})(\d{4})(\d{0,4})$/,'($1) $2-$3');else if(d.length>2)d=d.replace(/^(\d{2})(\d+)/,'($1) $2');e.target.value=d};$('form').onsubmit=async e=>{e.preventDefault();$('erro').textContent='';const cidade=$('cidade').value==='Outra cidade'?$('cidadeOutro').value.trim():$('cidade').value;const interesses=[...document.querySelectorAll('.checks input:checked')].map(x=>x.value);if(!$('nome').value.trim()||!$('whatsapp').value.trim()||!$('email').value.trim()||!cidade||!$('bairro').value.trim()){$('erro').textContent='Preencha os campos obrigatórios.';return}if(!interesses.length){$('erro').textContent='Selecione pelo menos um interesse.';return}if(!$('aceite').checked){$('erro').textContent='É necessário aceitar os termos.';return}const op=[`Bairro: ${$('bairro').value.trim()}`,`Interesses: ${interesses.join(', ')}`,`Como conheceu: ${$('origem').value||'-'}`].join(' | ');const dados={origem:'Cadastro direto - Cliente',nome:$('nome').value.trim(),whatsapp:$('whatsapp').value.trim(),email:$('email').value.trim(),cidade,tipo:'Cliente',ocupacao:'',avaliacao:'',indicaria:$('origem').value==='Indicação'?$('indicacao').value.trim():'',opiniao:op};$('submit').disabled=true;$('submit').textContent='Cadastrando...';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams(dados)});$('form').hidden=true;$('ok').hidden=false;scrollTo({top:0,behavior:'smooth'})}catch{$('erro').textContent='Não foi possível enviar agora. Tente novamente.';$('submit').disabled=false;$('submit').textContent='Criar meu cadastro'}};</script></body></html>
